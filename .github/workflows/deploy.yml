name: CD Pipeline

# On push to main: create and push an annotated version tag only.
# Production deploy: Vercel Git (not this workflow).

on:
  push:
    branches:
      - main

jobs:
  tag-release:
    name: CD Pipeline
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push annotated tag
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            MAJOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          TITLE=$(echo "$HEAD_MSG" | head -1)
          git tag -a "$NEW_TAG" "$HEAD_SHA" -m "Release ${NEW_TAG}: ${TITLE}"
          git push origin "$NEW_TAG"
